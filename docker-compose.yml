# Helix Migration — primary compose file.
#
# All services share the `helix-network` bridge. Internal services (Postgres,
# Redis, Temporal) are NOT published to the host — frontend and backend are the
# only externally reachable endpoints via the Caddy reverse proxy on 80/443.
# Temporal UI is opt-in (profile=debug); access via SSH tunnel only.
#
# Image names are env-driven so the same compose file works for:
#   - Local build:  docker compose -f docker-compose.yml -f docker-compose.build.yml up
#   - Pull pre-built: set HELIX_IMAGE_PREFIX=ghcr.io/your-org and run `docker compose pull`
#
# Requires Docker Compose v2.13+ for `service_completed_successfully` condition.
#
# Memory limits are sized for a GCP e2-medium (2 vCPU / 4 GB RAM).
# Total: 3450m leaves 550m headroom for kernel + Docker daemon on 4 GB VM.
# For e2-standard-2+ (8 GB), scale up via env vars (recommended pattern below):
#   export BACKEND_MEM=1200m WORKER_MEM=1200m POSTGRES_MEM=900m TEMPORAL_MEM=800m FRONTEND_MEM=500m
#   docker compose up
#
# ── Volume design — two named volumes (B-5 fix) ──────────────────────────────
#
#   helix_artifacts  — user-uploaded migration artifacts (SQL / Python scripts).
#                      Written and read exclusively by the backend service, mounted
#                      at /app/data/artifacts (ARTIFACT_STORAGE_PATH env var).
#
#   helix_planning   — BMAD agent planning artifacts (Markdown + latest.json index).
#                      Written by the worker at /app/_bmad-output/planning-artifacts/
#                      as mandated by _bmad/bmm/config.yaml's `output_folder` setting.
#                      Mounted read-only into the backend at /app/_bmad-output so the
#                      GET /api/v1/agent-workflows/{id}/artifact-content endpoint can
#                      resolve worker-produced BMAD paths without path translation.
#
# Background: prior to this fix both services shared `helix_artifacts` but mounted
# it at different container paths (/app/data/artifacts vs /app/_bmad-output). The
# worker wrote into _bmad-output/ while the backend saw data/artifacts/ as the
# volume root — those are non-overlapping sub-trees inside the same volume, so the
# artifact-content API always returned 404 for BMAD-generated outputs (B-5).
# ─────────────────────────────────────────────────────────────────────────────

x-image-prefix: &image-prefix ${HELIX_IMAGE_PREFIX:-helix}
x-image-tag: &image-tag ${HELIX_IMAGE_TAG:-latest}

# Log rotation anchor — applied to every service to prevent disk exhaustion.
# Caps log storage at ~30 MB per service (270 MB total across 9 services).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.4
    container_name: helix-postgres
    restart: unless-stopped
    # Internal only — no `ports:` block. Other services reach it via the helix-network DNS name `postgres`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run scripts/generate-secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:-helix_metadata}
    volumes:
      - helix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helix} -d ${POSTGRES_DB:-helix_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 600m
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: helix-redis
    restart: unless-stopped
    # Internal only.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 150m
    logging: *default-logging

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: helix-temporal
    restart: unless-stopped
    # Internal only — backend + worker reach it as `temporal:7233`.
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-helix}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>/dev/null || temporal operator cluster health --address temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 500m
    logging: *default-logging

  temporal-ui:
    # Opt-in only. Defaults to NOT exposing a public port. Operators who need
    # the dashboard run: `docker compose --profile debug up -d`. This avoids
    # accidental production exposure of the workflow internals.
    image: temporalio/ui:2.31.2
    container_name: helix-temporal-ui
    restart: unless-stopped
    profiles: ["debug"]
    ports:
      # Bind to 127.0.0.1 by default so a public-internet host cannot reach
      # the UI even when this profile is enabled. Override with
      # TEMPORAL_UI_BIND=0.0.0.0 only if the host is behind a reverse proxy
      # that enforces auth.
      - "${TEMPORAL_UI_BIND:-127.0.0.1}:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      # Temporal UI v2.31+ supports HTTP basic auth via these env vars.
      # Operators MUST set TEMPORAL_AUTH_ENABLED and TEMPORAL_UI_PASSWORD explicitly.
      # Leaving auth disabled on a publicly reachable UI is a security risk.
      - TEMPORAL_AUTH_ENABLED=${TEMPORAL_AUTH_ENABLED}
      - TEMPORAL_AUTH_PROVIDER_URL=
      - TEMPORAL_UI_PUBLIC_PATH=/
    depends_on:
      temporal:
        condition: service_started
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 100m
    logging: *default-logging

  backend-init:
    # One-shot service: runs Alembic migrations and exits.
    # Requires Docker Compose v2.13+ for `service_completed_successfully`.
    image: ${HELIX_IMAGE_PREFIX:-helix}/backend:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-backend-init
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helix-network
    mem_limit: 300m
    logging: *default-logging

  backend:
    image: ${HELIX_IMAGE_PREFIX:-helix}/backend:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-backend
    restart: unless-stopped
    # Loopback bind — Caddy on the same host proxies /api/* here.
    # Set BACKEND_BIND=0.0.0.0 only for local development without Caddy.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    init: true
    depends_on:
      backend-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - helix_artifacts:/app/data/artifacts
      # B-5: read-only view of worker BMAD output so artifact-content API can
      # resolve /app/_bmad-output/planning-artifacts/{project}/{agent}/*.md paths.
      - helix_planning:/app/_bmad-output:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 700m
    logging: *default-logging

  worker:
    image: ${HELIX_IMAGE_PREFIX:-helix}/worker:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      # W-002 / B-5: BMAD config writes artifacts to /app/_bmad-output/planning-artifacts.
      # Uses helix_planning (not helix_artifacts) so the backend can mount the same
      # volume read-only at /app/_bmad-output without sharing the uploads namespace.
      - helix_planning:/app/_bmad-output
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 700m
    logging: *default-logging

  frontend:
    image: ${HELIX_IMAGE_PREFIX:-helix}/frontend:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-frontend
    restart: unless-stopped
    # Loopback bind — Caddy on the same host proxies / here.
    # Set FRONTEND_BIND=0.0.0.0 only for local development without Caddy.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    init: true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 300m
    logging: *default-logging

  caddy:
    # Reverse proxy + automatic TLS (Let's Encrypt) via Caddy 2.
    # Terminates HTTPS on 443, proxies /api/* to backend and /* to frontend.
    # HELIX_PUBLIC_DOMAIN must point at this VM's external IP before first start
    # (Caddy performs an ACME HTTP-01 challenge on port 80).
    image: caddy:2-alpine
    container_name: helix-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      HELIX_PUBLIC_DOMAIN: ${HELIX_PUBLIC_DOMAIN:?HELIX_PUBLIC_DOMAIN is required — set to your domain (e.g. helix.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - helix-network
    # Sized for 4 GB VM; bump if running e2-standard-2+.
    mem_limit: 100m
    logging: *default-logging

volumes:
  helix_postgres_data:
    driver: local
  helix_artifacts:
    driver: local
  # B-5: separate volume for BMAD planning artifacts written by the worker.
  # Mounted rw in worker (/app/_bmad-output) and ro in backend (/app/_bmad-output).
  helix_planning:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  helix-network:
    driver: bridge
