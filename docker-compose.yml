# Helix Migration — primary compose file.
#
# All services share the `helix-network` bridge. Internal services (Postgres,
# Redis, Temporal) are NOT published to the host — frontend and backend are the
# only externally reachable endpoints. Temporal UI is exposed for operator
# debugging; protect it with the basic-auth bundled into the temporal-ui
# image OR put it behind a firewall.
#
# Image names are env-driven so the same compose file works for:
#   - Local build:  docker compose -f docker-compose.yml -f docker-compose.build.yml up
#   - Pull pre-built: set HELIX_IMAGE_PREFIX=ghcr.io/your-org and run `docker compose pull`

x-image-prefix: &image-prefix ${HELIX_IMAGE_PREFIX:-helix}
x-image-tag: &image-tag ${HELIX_IMAGE_TAG:-latest}

services:
  postgres:
    image: postgres:16.4
    container_name: helix-postgres
    restart: unless-stopped
    # Internal only — no `ports:` block. Other services reach it via the helix-network DNS name `postgres`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run scripts/generate-secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:-helix_metadata}
    volumes:
      - helix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helix} -d ${POSTGRES_DB:-helix_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4-alpine
    container_name: helix-redis
    restart: unless-stopped
    # Internal only.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: helix-temporal
    restart: unless-stopped
    # Internal only — backend + worker reach it as `temporal:7233`.
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-helix}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>/dev/null || temporal operator cluster health --address temporal:7233 2>/dev/null || true"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: helix-temporal-ui
    restart: unless-stopped
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      # Temporal UI v2.31+ supports HTTP basic auth via these env vars.
      - TEMPORAL_AUTH_ENABLED=${TEMPORAL_AUTH_ENABLED:-false}
      - TEMPORAL_AUTH_PROVIDER_URL=
      - TEMPORAL_UI_PUBLIC_PATH=/
    depends_on:
      temporal:
        condition: service_started
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    image: ${HELIX_IMAGE_PREFIX:-helix}/backend:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - helix_artifacts:/app/data/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ${HELIX_IMAGE_PREFIX:-helix}/worker:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - helix_artifacts:/app/data/artifacts
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    image: ${HELIX_IMAGE_PREFIX:-helix}/frontend:${HELIX_IMAGE_TAG:-latest}
    container_name: helix-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - helix-network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  helix_postgres_data:
    driver: local
  helix_artifacts:
    driver: local

networks:
  helix-network:
    driver: bridge
