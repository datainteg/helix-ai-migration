<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F4F3EF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(10,10,10,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(96, 130)">
    <rect width="96" height="96" rx="20" fill="url(#brand)"/>
    <text x="48" y="68" font-family="Inter, sans-serif" font-size="58" font-weight="700" text-anchor="middle" fill="#FFFFFF" letter-spacing="-3">H</text>
  </g>
  <text x="96" y="296" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="#0A0A0A" letter-spacing="-2.5">Helix Migration</text>
  <text x="96" y="356" font-family="Inter, sans-serif" font-size="34" font-weight="500" fill="#52525B" letter-spacing="-0.5">Open-source AI-powered migration</text>
  <text x="96" y="400" font-family="Inter, sans-serif" font-size="34" font-weight="500" fill="#52525B" letter-spacing="-0.5">and validation platform.</text>
  <g transform="translate(96, 470)">
    <rect width="220" height="52" rx="10" fill="#0A0A0A"/>
    <text x="110" y="33" font-family="Inter, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#FFFFFF">View demo</text>
    <rect x="240" width="220" height="52" rx="10" fill="none" stroke="#D4D4D8" stroke-width="2"/>
    <text x="350" y="33" font-family="Inter, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#27272A">Read docs</text>
  </g>
  <g transform="translate(820, 130)" opacity="0.9">
    <text font-family="JetBrains Mono, monospace" font-size="16" fill="#71717A">
      <tspan x="0" y="0">$ git clone github.com/datainteg/</tspan>
      <tspan x="0" y="24">    helix-ai-migration.git</tspan>
      <tspan x="0" y="60">$ cd helix-ai-migration</tspan>
      <tspan x="0" y="96">$ docker compose up -d</tspan>
    </text>
    <text x="0" y="160" font-family="JetBrains Mono, monospace" font-size="14" fill="#52525B">
      <tspan x="0" y="0">> 13-node BMAD pipeline</tspan>
      <tspan x="0" y="22">> 10 LLM providers</tspan>
      <tspan x="0" y="44">> Validation + recon</tspan>
      <tspan x="0" y="66">> Sprint management</tspan>
      <tspan x="0" y="88">> Apache 2.0 . self-hosted</tspan>
    </text>
  </g>
  <text x="96" y="582" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#71717A" letter-spacing="0.08em">HELIX.DATAINTEG.IO  .  APACHE 2.0  .  SELF-HOSTED</text>
</svg>
