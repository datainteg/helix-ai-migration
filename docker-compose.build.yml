# Build overlay — use with docker-compose.yml when building from source.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
#
# Or build the frontend with a specific public API URL (required for production):
#   NEXT_PUBLIC_API_URL=https://helix.example.com \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml build frontend
#
# NEXT_PUBLIC_API_URL is baked into the Next.js bundle at build time and cannot
# be changed at runtime. Always set it to your public domain before building.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
        # Set via env var before building for production, e.g.:
        #   NEXT_PUBLIC_API_URL=https://helix.example.com docker compose \
        #     -f docker-compose.yml -f docker-compose.build.yml build frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
