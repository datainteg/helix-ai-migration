[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",   # assert used in tests
    "S105",   # possible hardcoded password — false positives in test fixtures
    "S106",
    "B008",   # FastAPI Depends() calls in function defaults
    "E501",   # line too long — handled by formatter
]
per-file-ignores = { "backend/tests/*" = ["S", "E501"] }

[tool.ruff.lint.isort]
known-first-party = ["app", "agents", "connectors"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
