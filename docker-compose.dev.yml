# ─────────────────────────────────────────────────────────────────────────────
# DEV OVERLAY — hot reload, source-mounted volumes, exposed DB ports.
#
# DO NOT use this overlay in production — disables CORS validator, opens DB
# ports, and sets APP_ENV=development (relaxes JWT validation, enables debug
# endpoints, accepts placeholder secrets).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.build.yml up
#
# Volume note (mirrors docker-compose.yml B-5 fix):
#   helix_artifacts — user uploads, backend rw at /app/data/artifacts
#   helix_planning  — BMAD planning artifacts, worker rw + backend ro at /app/_bmad-output
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    container_name: helix-backend-dev
    volumes:
      # Mount source for live reload (uvicorn watches /app).
      - ./backend:/app
      - ./agents:/app/agents
      - ./_bmad:/app/_bmad
      - helix_artifacts:/app/data/artifacts
      # B-5: read-only view of worker BMAD planning artifacts (mirrors prod).
      - helix_planning:/app/_bmad-output:ro
    environment:
      APP_ENV: development

  worker:
    container_name: helix-worker-dev
    volumes:
      - ./worker:/app/worker
      - ./agents:/app/agents
      - ./_bmad:/app/_bmad
      - ./backend:/app/backend
      # W-002 / B-5: helix_planning (not helix_artifacts) so uploads and BMAD
      # artifacts remain in separate volumes, matching the prod volume layout.
      - helix_planning:/app/_bmad-output
    environment:
      APP_ENV: development

  frontend:
    container_name: helix-frontend-dev
    ports:
      - "127.0.0.1:${FRONTEND_DEV_HOST_PORT:-8080}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    container_name: helix-postgres-dev
    # Expose Postgres on loopback only for local dev tooling (DBeaver / psql).
    # Uses 127.0.0.1 bind to prevent accidental exposure if this overlay is
    # mistakenly passed on a VM with an open firewall.
    ports:
      - "127.0.0.1:${POSTGRES_DEV_HOST_PORT:-5432}:5432"

  redis:
    container_name: helix-redis-dev
    ports:
      - "127.0.0.1:${REDIS_DEV_HOST_PORT:-6379}:6379"

  temporal:
    container_name: helix-temporal-dev
    ports:
      - "127.0.0.1:${TEMPORAL_DEV_HOST_PORT:-7233}:7233"

  temporal-ui:
    container_name: helix-temporal-ui-dev
    profiles: []   # remove profile gate in dev so temporal-ui starts automatically
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
