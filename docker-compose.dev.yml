# Development overlay — hot reload, source-mounted volumes, dev-only DB creds.
#
# All credentials come from .env. Use scripts/generate-secrets.sh first.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.build.yml up

services:
  backend:
    container_name: helix-backend-dev
    volumes:
      # Mount source for live reload (uvicorn watches /app).
      - ./backend:/app
      - ./agents:/app/agents
      - ./_bmad:/app/_bmad
      - helix_artifacts:/app/data/artifacts
    environment:
      APP_ENV: development

  worker:
    container_name: helix-worker-dev
    volumes:
      - ./worker:/app/worker
      - ./agents:/app/agents
      - ./_bmad:/app/_bmad
      - ./backend:/app/backend
      - helix_artifacts:/app/data/artifacts
    environment:
      APP_ENV: development

  frontend:
    container_name: helix-frontend-dev
    ports:
      - "${FRONTEND_DEV_HOST_PORT:-8080}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    container_name: helix-postgres-dev
    # Expose Postgres on host for local dev tooling (DBeaver / psql).
    # Remove or change `ports:` if you don't want it on your host network.
    ports:
      - "${POSTGRES_DEV_HOST_PORT:-5432}:5432"

  redis:
    container_name: helix-redis-dev
    ports:
      - "${REDIS_DEV_HOST_PORT:-6379}:6379"

  temporal:
    container_name: helix-temporal-dev
    ports:
      - "${TEMPORAL_DEV_HOST_PORT:-7233}:7233"

  temporal-ui:
    container_name: helix-temporal-ui-dev
