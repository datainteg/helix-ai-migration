[project]
name = "helix-cli"
version = "0.2.0"
description = "Helix Migration CLI"
authors = [{name = "Helix Migration"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
helix = "helix_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helix_cli*"]
