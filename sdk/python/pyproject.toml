[project]
name = "helix-sdk"
version = "0.2.0"
description = "Python SDK for the Helix Migration platform"
authors = [{name = "Helix Migration"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helix_sdk*"]
